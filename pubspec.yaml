name: privacy_lens
description: "Privacy Lens: an on-device Android privacy auditor. Nothing leaves the phone."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  # drift_dev >=2.31 needs analyzer >=8.1, which conflicts with bloc_test on Dart 3.9.
  drift: ">=2.26.0 <2.31.0"
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  go_router: ^17.2.3
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  rive: ^0.14.11
  shared_preferences: ^2.5.5
  sqlcipher_flutter_libs: ^0.6.8
  sqlite3: ^2.9.4

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  drift_dev: ">=2.26.0 <2.31.0"
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^26.1.0

flutter:
  uses-material-design: true
  generate: true
  default-flavor: dev

  assets:
    - assets/rules/tracker_domains.txt
    - assets/rules/tracker_sdks.json
    - assets/rive/onboarding.riv

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
